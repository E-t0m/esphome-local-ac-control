# Transition firmware for the TCL configuration: switches the flash layout to eagle.flash.2m64.ld via OTA.
# It only contains Wi-Fi and update, so that it fits into the small free space of the old layout.
# Procedure: upload this firmware via OTA, wait for the reboot, then upload klima-tcl.yaml.
# While it is running, the air conditioner cannot be controlled.
# YAML does not allow tabs, hence indentation with spaces.

esphome:
  name: klimatcl
  friendly_name: Klima TCL
  platformio_options:
    board_build.ldscript: eagle.flash.2m64.ld

esp8266:
  board: esp_wroom_02
  restore_from_flash: true

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "klimatcl Fallback Hotspot"
    password: !secret tcl_recovery_pass

captive_portal:

api:
  encryption:
    key: !secret tcl_api_key

ota:
  - platform: esphome
    password: !secret tcl_ota_pass
  - platform: web_server

web_server:
  port: 80
  version: 3
  auth:
    username: admin
    password: !secret tcl_web_pass
