# Self-learning setpoint guidance for heating: keeps the compressor running at a low stage instead
# of letting it stop when the temperature is reached. This makes idle phases less frequent.
# Include under packages, after schedule.yaml (schedules then set the comfort temperature):
#   setpoint_guidance: !include setpoint-guidance.yaml
# Required substitutions in the device configuration:
#   guide_climate  id of the climate component
#   guide_running  C++ expression: compressor is running in heating mode
#   guide_stopped  C++ expression: compressor is stopped
#   guide_step     smallest setpoint step of the unit in °C
# YAML does not allow tabs, hence indentation with spaces.
#
# Learning: at every compressor stop in heating mode the module records how far the room temperature
# was above the setpoint (stop offset), likewise at every restart (restart offset). Each becomes a
# moving average that survives reboots and power cuts.
# Guiding: once enough stops have been measured and guidance is on, the module keeps the setpoint at
#   room temperature − stop offset + safety margin,
# at most the comfort temperature and not lower than comfort temperature − max reduction.
# Below the comfort temperature, after a stop and more than "overheat limit" above the comfort
# temperature, the comfort temperature is used as setpoint; the unit then regulates as usual.
# A setpoint changed by hand becomes the new comfort temperature.

globals:
  # learned values in one stored block (the settings storage of the ESP8266 is small):
  # stop offset, number of stops, restart offset, number of restarts
  - id: guide_learn
    type: float[4]
    restore_value: true
    initial_value: "{0, 0, 0, 0}"
  # setpoint last set by the module and when (millis)
  - id: guide_last_set
    type: float
    initial_value: "NAN"
  - id: guide_last_change
    type: uint32_t
    initial_value: "0"

web_server:
  sorting_groups:
    - id: guide_group
      name: Setpoint guidance
      sorting_weight: 20

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // use temperatures from schedules as comfort temperature while guidance is on
          schedule::temperature_hook() = [](float t) -> bool {
            if (!id(guide_switch).state) return false;
            id(guide_comfort).make_call().set_value(t).perform();
            return true;
          };

switch:
  - platform: template
    name: Setpoint guidance
    id: guide_switch
    icon: mdi:thermostat-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 1
    # Both actions also run when the switch is restored at boot. Then the climate component has
    # not yet read the unit, and any command would send its default state (e.g. off) to the unit.
    # Therefore they only act after the first minute.
    turn_on_action:
      - lambda: |-
          if (millis() < 60000) return;
          // take the comfort temperature from the current setpoint when switching on
          auto *c = id(${guide_climate});
          if (!std::isnan(c->target_temperature))
            id(guide_comfort).make_call().set_value(c->target_temperature).perform();
          id(guide_last_set) = NAN;
    turn_off_action:
      - lambda: |-
          if (millis() < 60000 || std::isnan(id(guide_last_set))) return;
          // set the setpoint back to the comfort temperature
          auto call = id(${guide_climate}).make_call();
          call.set_target_temperature(id(guide_comfort).state);
          call.perform();
          id(guide_last_set) = NAN;

number:
  - platform: template
    name: Comfort temperature
    id: guide_comfort
    icon: mdi:home-thermometer
    unit_of_measurement: °C
    min_value: 16
    max_value: 31
    step: 0.5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 22
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 2
  - platform: template
    name: Guidance safety margin
    id: guide_margin
    icon: mdi:arrow-expand-vertical
    entity_category: config
    unit_of_measurement: °C
    min_value: 0
    max_value: 2
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.5
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 10
  - platform: template
    name: Guidance overheat limit
    id: guide_overheat
    icon: mdi:thermometer-alert
    entity_category: config
    unit_of_measurement: °C
    min_value: 0
    max_value: 3
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 11
  - platform: template
    name: Guidance max reduction
    id: guide_max_red
    icon: mdi:thermometer-minus
    entity_category: config
    unit_of_measurement: °C
    min_value: 0
    max_value: 8
    step: 0.5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 4
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 12
  - platform: template
    name: Guidance min interval
    id: guide_interval
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 13
  - platform: template
    name: Guidance learning weight
    id: guide_weight
    icon: mdi:school-outline
    entity_category: config
    min_value: 0.05
    max_value: 1
    step: 0.05
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.3
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 14
  - platform: template
    name: Guidance samples needed
    id: guide_samples
    icon: mdi:counter
    entity_category: config
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 15

text_sensor:
  - platform: template
    name: Guidance status
    id: guide_status
    icon: mdi:information-outline
    update_interval: never
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 3
  - platform: template
    name: Guidance learned
    id: guide_learned
    icon: mdi:chart-bell-curve
    update_interval: never
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 4

button:
  - platform: template
    name: Guidance reset learning
    id: guide_reset
    icon: mdi:restore
    entity_category: config
    web_server:
      sorting_group_id: guide_group
      sorting_weight: 16
    on_press:
      - lambda: |-
          for (auto &v : id(guide_learn)) v = 0;
          ESP_LOGI("guidance", "Learned values reset");

interval:
  - interval: 15s
    then:
      - lambda: |-
          auto *c = id(${guide_climate});
          const float room = c->current_temperature;
          const float ts = c->target_temperature;
          const bool heat = c->mode == climate::CLIMATE_MODE_HEAT;
          const bool running = ${guide_running};
          const bool stopped = ${guide_stopped};
          const float step = ${guide_step};
          const uint32_t now = millis();

          // learning: transition running <-> stopped in heating mode, other states (e.g. defrost) do not count
          static int prev = -1;
          const int state = running ? 1 : (stopped ? 0 : -1);
          if (heat && state >= 0 && prev >= 0 && state != prev && !std::isnan(room) && !std::isnan(ts)) {
            const float d = room - ts;
            if (d > -4 && d < 6) {
              const float w = id(guide_weight).state;
              float &off = id(guide_learn)[state == 0 ? 0 : 2];
              float &n = id(guide_learn)[state == 0 ? 1 : 3];
              off = n == 0 ? d : off + w * (d - off);
              n += 1;
              ESP_LOGI("guidance", "%s at room %.1f, setpoint %.1f: offset %+.1f, average %+.2f (n=%d)",
                       state == 0 ? "Compressor stop" : "Compressor restart", room, ts, d, off, (int) n);
            }
          }
          if (state >= 0 && heat) prev = state;
          if (!heat) prev = -1;

          char buf[96];
          const auto &learn = id(guide_learn);
          snprintf(buf, sizeof(buf), "stop %+.1f °C (n=%d), restart %+.1f °C (n=%d)", learn[0], (int) learn[1],
                   learn[2], (int) learn[3]);
          if (id(guide_learned).state != buf) id(guide_learned).publish_state(buf);

          auto status = [](const char *s) {
            if (id(guide_status).state != s) id(guide_status).publish_state(s);
          };
          if (!id(guide_switch).state) {
            status("Off");
            return;
          }
          const float comfort = id(guide_comfort).state;

          // setpoint changed by hand: use it as new comfort temperature
          if (!std::isnan(id(guide_last_set)) && !std::isnan(ts) && std::fabs(ts - id(guide_last_set)) > step / 4 &&
              now - id(guide_last_change) > 30000) {
            ESP_LOGI("guidance", "Setpoint set by hand to %.1f, used as comfort temperature", ts);
            id(guide_comfort).make_call().set_value(ts).perform();
            id(guide_last_set) = ts;
            return;
          }

          if (!heat) {
            status("Not heating");
            return;
          }
          if ((int) learn[1] < (int) id(guide_samples).state) {
            snprintf(buf, sizeof(buf), "Learning (%d/%d stops)", (int) learn[1], (int) id(guide_samples).state);
            status(buf);
            return;
          }
          if (std::isnan(room) || state < 0) return;

          float target;
          if (room > comfort + id(guide_overheat).state) {
            target = comfort;
            snprintf(buf, sizeof(buf), "Room %.1f too warm, pause allowed", room);
          } else if (state == 0) {
            target = comfort;
            snprintf(buf, sizeof(buf), "Compressor stopped, setpoint %.1f", comfort);
          } else if (room < comfort) {
            target = comfort;
            snprintf(buf, sizeof(buf), "Heating up, room %.1f", room);
          } else {
            target = room - learn[0] + id(guide_margin).state;
            target = std::max(comfort - id(guide_max_red).state, std::min(comfort, target));
            target = std::ceil(target / step - 0.001f) * step;
            snprintf(buf, sizeof(buf), "Holding, room %.1f, setpoint %.1f", room, target);
          }
          status(buf);
          if (std::isnan(ts) || std::fabs(target - ts) < step / 2) {
            id(guide_last_set) = ts;
            return;
          }
          // lower at most every "min interval", raise to the comfort temperature immediately
          if (target < ts && now - id(guide_last_change) < (uint32_t) id(guide_interval).state * 60000UL &&
              id(guide_last_change) != 0)
            return;
          ESP_LOGI("guidance", "Setpoint %.1f -> %.1f (room %.1f, comfort %.1f)", ts, target, room, comfort);
          id(guide_last_set) = target;
          id(guide_last_change) = now;
          auto call = c->make_call();
          call.set_target_temperature(target);
          call.perform();
